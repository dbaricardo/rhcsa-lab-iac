---
# Instala em cada host (servera, serverb, workstation) o layout dos labs
# legados examsim-* IGUAL ao das VMs do homelab, a partir da árvore espelhada
# labs/hosts/<host>/ (ver labs/README.md):
#   servera/serverb: /usr/local/bin/lab (dispatcher local), lab-common.sh,
#                    /usr/local/lib/{lab-scripts,lab-grade,lab-finish}/<id>.sh
#   servera:         /usr/local/lib/lab-network-reset.sh
#   serverb:         /usr/local/lib/lab-full/examsim-full-serverb.sh
#   workstation:     só o lado servidor NFS de examsim-autofs-remoteuser2
#                    (o /usr/local/bin/lab, rhcsa-lab-original e lab-full/ da
#                    workstation são do role `workstation`).

- name: Remover artefatos do layout antigo do iac (lab-remote + labs/<id>/<ação>.sh)
  ansible.builtin.file:
    path: /usr/local/bin/lab-remote
    state: absent

- name: Resolver o caminho absoluto da árvore espelhada
  ansible.builtin.set_fact:
    lab_common_root: "{{ lab_common_tree | realpath }}"

- name: Listar arquivos da árvore espelhada deste host
  ansible.builtin.find:
    paths: "{{ lab_common_root }}"
    recurse: true
    file_type: file
    hidden: false
  delegate_to: localhost
  become: false
  register: lab_common_files

- name: Falhar cedo se não houver árvore para este host
  ansible.builtin.assert:
    that: lab_common_files.matched | int > 0
    fail_msg: "labs/hosts/{{ inventory_hostname }}/ vazio ou inexistente ({{ lab_common_root }})"

- name: Criar diretórios dos labs (0755 root:root, como no homelab)
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: >-
    {{ ['/usr/local/lib/lab-scripts', '/usr/local/lib/lab-grade', '/usr/local/lib/lab-finish']
       + (['/usr/local/lib/lab-full'] if inventory_hostname in ['servera', 'serverb'] else []) }}

- name: Instalar scripts e helpers do homelab
  ansible.builtin.copy:
    src: "{{ item.path }}"
    dest: "{{ item.path | replace(lab_common_root, '') }}"
    owner: "{{ ((item.path | replace(lab_common_root, '')) in lab_common_student_owned) | ternary(lab_student_user, 'root') }}"
    group: "{{ ((item.path | replace(lab_common_root, '')) in lab_common_student_owned) | ternary(lab_student_user, 'root') }}"
    mode: >-
      {{ lab_common_modes[item.path | replace(lab_common_root, '')]
         | default(lab_common_default_mode) }}
  loop: "{{ lab_common_files.files | sort(attribute='path') }}"
  loop_control:
    label: "{{ item.path | replace(lab_common_root, '') }}"

- name: Restaurar contexto SELinux padrão dos arquivos instalados
  ansible.builtin.command: restorecon -R /usr/local/bin /usr/local/lib
  changed_when: false
