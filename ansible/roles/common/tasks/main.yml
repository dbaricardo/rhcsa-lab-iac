---
- name: Garantir usuário {{ lab_student_user }} com sudo sem senha
  ansible.builtin.user:
    name: "{{ lab_student_user }}"
    groups: wheel
    shell: /bin/bash
    create_home: true
    append: true

- name: Sudo sem senha para {{ lab_student_user }}
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/{{ lab_student_user }}"
    content: "{{ lab_student_user }} ALL=(ALL) NOPASSWD: ALL\n"
    owner: root
    group: root
    mode: "0440"
    validate: "visudo -cf %s"

- name: Repositórios do deploy (subscription ou ISO offline) + chave GPG
  ansible.builtin.include_tasks: repos.yml

# Nomes ens18/ens19 + perfil NM "ens18" estático (igual ao homelab). Pode
# reiniciar a VM uma vez (troca de nome da interface de gerência).
- name: Rede igual ao homelab (ens18/ens19)
  ansible.builtin.include_tasks: network.yml

- name: Popular /etc/hosts igual ao homelab (traduzido)
  ansible.builtin.template:
    src: hosts.j2
    dest: /etc/hosts
    owner: root
    group: root
    mode: "0644"

# Paridade de pacotes com as VMs do homelab (`rpm -qa` de 2026-10-16).
- name: Pacotes iguais aos do homelab
  ansible.builtin.include_tasks: packages.yml

- name: Habilitar chronyd
  ansible.builtin.systemd:
    name: chronyd
    enabled: true
    state: started

- name: PermitRootLogin yes (igual ao homelab; root entra só por chave)
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/01-permitrootlogin.conf
    content: |
      # This file has been generated by the Anaconda Installer.
      # Allow root to log in using ssh. Remove this file to opt-out.
      PermitRootLogin yes
    owner: root
    group: root
    mode: "0600"
  notify: recarregar sshd

# Remote "flathub" de sistema, como em servera e workstation do homelab
# (serverb não tem flatpak). Adicionado a partir do .flatpakrepo oficial
# versionado no role: não precisa de rede no deploy.
- name: Remote flathub de sistema (hosts com flatpak no homelab)
  when: inventory_hostname in common_flathub_hosts
  block:
    - name: Diretório /usr/local/share/rhcsa-lab
      ansible.builtin.file:
        path: /usr/local/share/rhcsa-lab
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Copiar flathub.flatpakrepo
      ansible.builtin.copy:
        src: flathub.flatpakrepo
        dest: /usr/local/share/rhcsa-lab/flathub.flatpakrepo
        owner: root
        group: root
        mode: "0644"

    - name: Listar remotes flatpak de sistema
      ansible.builtin.command: flatpak remotes --system --columns=name
      register: common_flatpak_remotes
      changed_when: false

    - name: Adicionar remote flathub de sistema
      ansible.builtin.command:
        argv: [flatpak, remote-add, --system, --if-not-exists, flathub, /usr/local/share/rhcsa-lab/flathub.flatpakrepo]
      changed_when: true
      when: "'flathub' not in common_flatpak_remotes.stdout_lines"

- name: Garantir firewalld ativo
  ansible.builtin.systemd:
    name: firewalld
    enabled: true
    state: started

- name: Garantir SELinux enforcing (persistente)
  ansible.posix.selinux:
    policy: targeted
    state: enforcing

# Bug conhecido (ver docs/explanation/problemas-conhecidos.md): clonar uma VM pode deixar
# /etc/machine-id ou perfis de rede com contexto SELinux unlabeled_t, o que
# derruba journald -> dbus -> NetworkManager em cascata sem AVC visível em
# ausearch (só aparece em dmesg). O kickstart e image/finalize.sh já mitigam,
# isto é defesa em profundidade adicional, idempotente.
- name: Corrigir contexto SELinux de /etc caso algum clone tenha ficado com unlabeled_t
  ansible.builtin.command: restorecon -R /etc
  changed_when: false
