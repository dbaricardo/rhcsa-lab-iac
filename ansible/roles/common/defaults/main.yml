---
# URL base de um repositório BaseOS/AppStream servido via HTTP (ex.:
# http://192.168.56.1:8080), montado a partir da DVD ISO por
# scripts/offline-repo.sh. Vazio (padrão) = fluxo normal com subscription
# (RHSM_* do .env ou registro manual), ver docs/how-to/resolver-problemas.md.
#
# Uso: apenas para ambiente de TESTE/aceitação sem subscription real (ver
# docs/how-to/deploy-offline.md e docs/explanation/arquitetura.md, seção
# "Subscription e modo offline"). Não é um substituto
# de produção: não traz updates/erratas, só o conteúdo congelado da ISO.
lab_offline_repo_url: ""

# Registro automático da subscription (Red Hat Developer Subscription for
# Individuals, gratuita), vindo do .env via ambiente do `make`. Vazio = não
# registra automaticamente (ver tasks/main.yml).
lab_rhsm_org_id: "{{ lookup('ansible.builtin.env', 'RHSM_ORG_ID') }}"
lab_rhsm_activation_key: "{{ lookup('ansible.builtin.env', 'RHSM_ACTIVATION_KEY') }}"

# Hosts que têm o remote flatpak "flathub" de sistema no homelab (serverb
# não tem nem o pacote flatpak).
common_flathub_hosts: [servera, workstation]

# Pacotes que os exercícios (examsim-*, examsim-full, dyn-*) pressupõem
# instalados -- conferidos com `rpm -q` no fim de tasks/packages.yml.
common_required_packages_base:
  - acl
  - autofs
  - chrony
  - dosfstools
  - lvm2
  - nfs-utils
  - parted
  - policycoreutils-python-utils
  - tuned
  - xfsprogs
  - python3
common_required_packages:
  servera: "{{ common_required_packages_base + ['httpd', 'flatpak'] }}"
  serverb: "{{ common_required_packages_base + ['httpd'] }}"
  workstation: "{{ common_required_packages_base + ['flatpak', 'createrepo_c', 'rpm-build', 'ostree'] }}"
