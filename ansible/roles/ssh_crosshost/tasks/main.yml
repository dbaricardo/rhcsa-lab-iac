---
# Roda contra os 3 hosts na mesma passada (site.yml aplica este role a
# `all`), usando hostvars para levar a chave pública gerada na workstation
# até os outros hosts -- evita condição de corrida de gerar a chave numa
# execução e distribuir noutra.
#
# Igual ao homelab: a chave ed25519 do student da workstation
# (comentário student@workstation.lab.example.com) entra em
#   - ~student/.ssh/authorized_keys de servera/serverb;
#   - /root/.ssh/authorized_keys de servera, serverb E workstation -- o
#     dispatcher (rhcsa-lab-original), examsim-full.sh/examsim-dinamico.sh e
#     o ai_review.py usam `ssh -o BatchMode=yes root@servera|serverb|localhost`.

- name: Gerar par de chaves ed25519 para o student na workstation
  ansible.builtin.user:
    name: "{{ lab_student_user }}"
    generate_ssh_key: true
    ssh_key_type: ed25519
    ssh_key_file: .ssh/id_ed25519
    ssh_key_comment: "{{ lab_student_user }}@workstation.{{ lab_domain }}"
  when: inventory_hostname == 'workstation'

- name: Ler chave pública gerada na workstation
  ansible.builtin.slurp:
    src: "/home/{{ lab_student_user }}/.ssh/id_ed25519.pub"
  register: workstation_pubkey_raw
  when: inventory_hostname == 'workstation'

- name: Publicar chave pública como fato (acessível via hostvars pelos outros hosts)
  ansible.builtin.set_fact:
    workstation_student_pubkey: "{{ workstation_pubkey_raw.content | b64decode | trim }}"
  when: inventory_hostname == 'workstation'

- name: Autorizar chave da workstation no student de servera/serverb
  ansible.posix.authorized_key:
    user: "{{ lab_student_user }}"
    key: "{{ hostvars['workstation'].workstation_student_pubkey }}"
    state: present
  when: inventory_hostname in ['servera', 'serverb']

- name: Autorizar chave do student da workstation no root das 3 VMs
  ansible.posix.authorized_key:
    user: root
    key: "{{ hostvars['workstation'].workstation_student_pubkey }}"
    state: present

# known_hosts pré-populado com as chaves de host REAIS (lidas de cada VM),
# para o 1o `ssh -o BatchMode=yes root@servera` não depender de
# accept-new (que também está ligado, como no homelab).
- name: Ler chave de host ed25519 de cada VM
  ansible.builtin.slurp:
    src: /etc/ssh/ssh_host_ed25519_key.pub
  register: ssh_crosshost_hostkey_raw

- name: Publicar chave de host como fato
  ansible.builtin.set_fact:
    ssh_crosshost_hostkey: "{{ (ssh_crosshost_hostkey_raw.content | b64decode).split()[:2] | join(' ') }}"

- name: known_hosts do student e do root na workstation (servera, serverb, workstation, localhost)
  ansible.builtin.known_hosts:
    path: "{{ item.0 }}"
    name: "{{ item.1.name }}"
    key: "{{ item.1.name }} {{ hostvars[item.1.host].ssh_crosshost_hostkey }}"
    state: present
  loop: "{{ ['/home/' ~ lab_student_user ~ '/.ssh/known_hosts', '/root/.ssh/known_hosts'] | product(ssh_crosshost_known_names) | list }}"
  loop_control:
    label: "{{ item.0 | dirname | dirname | basename }}: {{ item.1.name }}"
  when: inventory_hostname == 'workstation'

- name: Dono do known_hosts do student
  ansible.builtin.file:
    path: "/home/{{ lab_student_user }}/.ssh/known_hosts"
    owner: "{{ lab_student_user }}"
    group: "{{ lab_student_user }}"
    mode: "0600"
  when: inventory_hostname == 'workstation'

- name: Gerar ~/.ssh/config na workstation (igual ao homelab, IPs traduzidos)
  ansible.builtin.template:
    src: ssh_config.j2
    dest: "/home/{{ lab_student_user }}/.ssh/config"
    owner: "{{ lab_student_user }}"
    group: "{{ lab_student_user }}"
    mode: "0600"
  when: inventory_hostname == 'workstation'
