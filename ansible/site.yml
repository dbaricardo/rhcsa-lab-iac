---
# Playbook principal, rodado por `make provision` (ou `make deploy`) contra o
# inventário que o Terraform gera em output/inventory.yml. Ordem: esperar as
# VMs recém-criadas aceitarem SSH, infraestrutura comum a todos os hosts
# (common + ssh_crosshost dependem de rodar juntos, na mesma play, para o
# truque de hostvars funcionar), depois os papéis específicos.

- name: RHCSA lab - esperar as VMs subirem e fixar o hostname
  hosts: all
  gather_facts: false
  become: true
  tasks:
    - name: Esperar SSH (VMs acabaram de ser criadas pelo Terraform)
      ansible.builtin.wait_for_connection:
        timeout: 300

    - name: Hostname FQDN de machines.yaml (a imagem golden vem como rhcsa-lab-base)
      ansible.builtin.hostname:
        name: "{{ inventory_hostname }}.{{ lab_domain }}"

- name: RHCSA lab - infraestrutura comum (usuário, hosts, SELinux, SSH cruzado)
  hosts: all
  become: true
  roles:
    - common
    - ssh_crosshost

# "Classroom" do homelab (LXC 205) na workstation: precisa de dnf e da ISO
# servida pelo host, por isso roda antes do lockdown.
- name: workstation - classroom (mirror :8091, flatpak myrepo, NTP)
  hosts: workstation
  become: true
  roles:
    - classroom

- name: servera - pacotes e exercícios locais atribuídos a este host
  hosts: servera
  become: true
  roles:
    - servera
    - lab_common

- name: serverb - pacotes, discos extra e exercícios locais atribuídos a este host
  hosts: serverb
  become: true
  roles:
    - serverb
    - lab_common

- name: workstation - dashboard, wrapper `lab`, exame dinâmico e revisão por IA
  hosts: workstation
  become: true
  roles:
    - dashboard
    - workstation
    # Lado workstation do examsim-autofs-remoteuser2 (labs/hosts/workstation).
    - lab_common
    - lab_dyn
    # Opcional: no-op (remove resíduos) com ai_review_enabled/rhcsa_recording_enabled=false.
    - ai_review

# Estado final igual ao homelab: nenhum repositório habilitado nas 3 VMs (os
# exercícios examsim-repo-* / dyn-repo-* configuram o repo do classroom do
# zero). A subscription, se houver, fica registrada (sem unregister) e com
# todos os repos desabilitados -- o próximo `make provision` religa
# BaseOS/AppStream (roles/common/tasks/repos.yml).
- name: RHCSA lab - lockdown final dos repositórios
  hosts: all
  become: true
  tasks:
    - name: Remover os repos do modo offline
      ansible.builtin.yum_repository:
        name: "{{ item }}"
        state: absent
      loop: [lab-offline-baseos, lab-offline-appstream]

    - name: Ver se o host está registrado na subscription
      ansible.builtin.command: subscription-manager identity
      register: lockdown_identity
      changed_when: false
      failed_when: false

    - name: Desabilitar todos os repos da subscription
      ansible.builtin.command: subscription-manager repos --disable=*
      changed_when: false
      when: lockdown_identity.rc == 0

    - name: Listar repos ainda habilitados
      ansible.builtin.shell: |
        set -o pipefail
        dnf -q repolist --enabled 2>/dev/null | awk 'NR>1 {print $1}'
      args:
        executable: /bin/bash
      register: lockdown_repolist
      changed_when: false

    - name: Conferir que nenhum repo ficou habilitado
      ansible.builtin.assert:
        that: lockdown_repolist.stdout_lines | length == 0
        fail_msg: "{{ inventory_hostname }}: repos ainda habilitados: {{ lockdown_repolist.stdout_lines }}"
        quiet: true

    - name: Limpar o cache do dnf (nada apontando para a ISO/CDN do deploy)
      ansible.builtin.command: dnf clean all
      changed_when: false
